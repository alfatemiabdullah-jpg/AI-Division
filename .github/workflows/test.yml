name: Abdullah AI checks

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  test:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
